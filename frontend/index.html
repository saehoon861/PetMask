<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PetMask</title>

    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>PetMask</h1>
    </header>

    <main>

        <section class="upload-section">

            <h2>Pet Segmentation</h2>
            <p>Upload Pet Image</p>

            <div class="drop-zone" id="drop-zone">
                <p>Drag & Drop</p>
                <p>or click to upload</p>

                <input
                    type="file"
                    id="image-input"
                    accept=".jpg,.jpeg,.png"
                    hidden
                >
            </div>

            <button id="segment-button">
                Segment
            </button>

        </section>

        <section class="samples-section">
            <h2>Start with Samples</h2>
            <p>Don't have a photo? Try these samples.</p>
            <div class="samples-container">
                <img src="samples/boxer_16.jpg" alt="Sample 1" class="sample-image">
                <img src="samples/chihuahua_165.jpg" alt="Sample 2" class="sample-image">
                <img src="samples/pug_183.jpg" alt="Sample 3" class="sample-image">
                <img src="samples/2022052401445_0.jpg" alt="Sample 4" class="sample-image">
                <img src="samples/고양이앤드지디.jpg" alt="Sample 6" class="sample-image">
                <img src="samples/고양이지디.jpeg" alt="Sample 7" class="sample-image">
            </div>
        </section>

        <section class="result-section">

            <div class="image-panel">
                <h3>Original</h3>

                <div class="image-box">
                    <img
                        id="original-image"
                        alt="Original image"
                    >
                </div>
            </div>


            <div class="image-panel">
                <h3>Result</h3>

                <div class="image-box">
                    <img
                        id="result-image"
                        alt="Segmentation result"
                    >
                </div>
            </div>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 PetMask. All rights reserved.</p>
    </footer>

     <!-- 추론 로딩 오버레이 -->
    <div id="loading-overlay" class="loading-overlay">

        <div class="loading-content">

            <div class="spinner"></div>

            <h2>추론 중입니다 — 잠시만 기다려 주세요</h2>

            <p>
                AI가 반려동물 이미지를 정밀하게 분석하고 있습니다.
            </p>

        </div>

    </div>


    <script src="js/main.js"></script>

</body>

</html>
